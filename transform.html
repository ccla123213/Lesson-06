        }
        .box2{

        }
        .box3{
            width: 200px;
            height: 200px;
            text-align: center;

            background-color: pink;
            transform: translate(400px);
        }
        .box4{
            width: 200px;
            height: 200px;
            text-align: center;
            font-size: 1.2em;
            background-color: pink;
            transform: scale(1.5);
        }
    </style>
</head>
<body>
    <div class="box">

    <div class="box2">

    <div class="box4">
