<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @keyframes MyAnim {
            0% {background-color: rgb(255, 155, 172); left: 0px; top: 0px;}
            20% {background-color: rgb(187, 0, 31); left: 200px; top: 0px;}
            40% {background-color: red; left: 200px; top: 200px;}
            60% {background-color: rgb(84, 145, 84); top: 200px; left: 0px;}
            80% {background-color: rgb(107, 161, 211); top: 0px;}
            100% {background-color: pink; top: 0px; left: 0px;}
        }
        .box{
            width: 200px;
            height: 200px;
            background-color: pink;
            font-size: 1.5em;
            text-align: center;
            position: relative;
            animation-name: MyAnim;
            animation-duration: 5s;
            animation-play-state: running;
            animation-iteration-count: infinite;
        }
    </style>
</head>
<body>
    <h1>css animation</h1>
    <div class="box">box</div>
</body>
</html>
